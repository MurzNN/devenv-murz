name: Publish Helm chart

on:
  push:
    branches: [ "main" ]
    paths:
      - "helm/**"
      - ".github/workflows/publish-chart.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and push chart
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner=$(echo "${REGISTRY_OWNER}" | tr '[:upper:]' '[:lower:]')
          version=$(awk '/^version:/ { print $2; exit }' helm/Chart.yaml)
          registry="oci://ghcr.io/${owner}/charts"
          chart="${registry}/devenv-node"

          if helm show chart "${chart}" --version "${version}" >/dev/null 2>&1; then
            echo "::error::${chart} version ${version} is already published. Bump version in helm/Chart.yaml."
            exit 1
          fi

          helm dependency build helm
          mkdir -p "${RUNNER_TEMP}/charts"
          helm package helm --destination "${RUNNER_TEMP}/charts"
          helm push "${RUNNER_TEMP}/charts/devenv-node-${version}.tgz" "${registry}"
