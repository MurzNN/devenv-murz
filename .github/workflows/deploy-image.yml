name: Build and Push

on:
  push:
    branches: [ "main" ]

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This converts the repository path to lowercase using a standard Linux shell command
      - name: Set lowercase repository path
        run: |
          LOWERSCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PATH=$LOWERSCASE_REPO" >> $GITHUB_ENV

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Uses the environment variable created above to build and push safely
      - name: Build and Push Image
        run: |
          docker build --progress=plain -t ghcr.io/${{ env.IMAGE_PATH }}:latest .
          docker push ghcr.io/${{ env.IMAGE_PATH }}:latest
