{{/*
SSH host key for sshd.

The private key is generated on the first install and stored in this Secret.
On later upgrades, lookup reads the live Secret and renders the same key, so
the host key stays stable. If the Secret is missing, a new ed25519 key is
generated. genPrivateKey runs only in that branch.

lookup is empty for helm template and for clients that cannot get Secrets.
Those renders produce a throwaway key, not the key stored by a cluster install.
The deploy account must be able to get Secrets in this namespace, or every
upgrade will mint a new host key.

The key is PKCS#8 (BEGIN PRIVATE KEY), which OpenSSH on the devenv image loads.
Supervisor copies it to mode 0600 before starting sshd, because fsGroup widens
a 0600 volume file and sshd rejects that.

loader.init merges library defaults first. The fullname helper reads
.Values.global and fails when that map has not been initialized yet.
*/}}
{{- include "bjw-s.common.loader.init" . -}}
{{- $secretName := printf "%s-ssh-host-key" (include "bjw-s.common.lib.chart.names.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if $existing -}}
{{- $existingData = $existing.data | default dict -}}
{{- end -}}
{{- /* Reuse the stored key when present. Generate only when it is absent. */ -}}
{{- $privateKey := "" -}}
{{- if hasKey $existingData "ssh_host_key" -}}
{{- $privateKey = index $existingData "ssh_host_key" -}}
{{- else -}}
{{- $privateKey = genPrivateKey "ed25519" | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
type: Opaque
data:
  ssh_host_key: {{ $privateKey | quote }}
